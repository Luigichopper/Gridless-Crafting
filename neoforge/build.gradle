plugins {
    id "com.gradleup.shadow" version "8.3.6"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "gridless-common.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.neoforged:forge:${rootProject.neoforge_version}"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixin_extras_version}"))

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching(["META-INF/neoforge.mods.toml", "META-INF/mods.toml"]) {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
    destinationDirectory.set(layout.buildDirectory.dir("devlibs"))
}

tasks.matching { it.name == "remapJar" }.configureEach {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set "neoforge"
}

jar {
    archiveClassifier.set "dev"
    destinationDirectory.set(layout.buildDirectory.dir("devlibs"))
}
