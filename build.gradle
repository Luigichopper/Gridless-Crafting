plugins {
    id "architectury-plugin" version "3.5.169"
    id "dev.architectury.loom-no-remap" version "1.17.493" apply false
}

version = rootProject.mod_version + "+" + rootProject.minecraft_version

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "MinecraftForge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "Shedaniel"
            url = "https://maven.shedaniel.me/"
        }
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    base.archivesName.set(rootProject.archives_base_name)
    version = rootProject.version
    group = rootProject.maven_group

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = Integer.parseInt(rootProject.java_version)
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_version))
        }
        withSourcesJar()
    }
}
